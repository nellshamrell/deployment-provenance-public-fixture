name: Protected deployment provenance probe

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  id-token: write
  contents: write
  packages: write
  actions: write
  checks: read
  deployments: read

jobs:
  probe:
    name: Compare Actions, check run, and deployment identities
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Read exact first-attempt provenance with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def read(label, path, body=None):
              request = Request(
                  os.environ["GITHUB_API_URL"] + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"{label}: HTTP {error.code}") from None
              except (URLError, TimeoutError, ValueError):
                  raise SystemExit(f"{label}: request failed or response was invalid") from None

          repo = os.environ["GITHUB_REPOSITORY"]
          environment = os.environ["TARGET_ENVIRONMENT"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          require(os.environ["GITHUB_RUN_ATTEMPT"] == "1", "Use a fresh dispatch, not a rerun.")
          base = f"/repos/{repo}"
          run = read("Actions run", f"{base}/actions/runs/{run_id}")
          require(
              run.get("id") == run_id and run.get("run_attempt") == 1
              and run.get("event") == "workflow_dispatch"
              and run.get("path") == ".github/workflows/deployment-provenance-diagnostic.yml"
              and run.get("repository", {}).get("full_name") == repo
              and run.get("node_id"),
              "Actions run did not match the first-attempt dispatch.",
          )
          result = read("Exact attempt jobs", f"{base}/actions/runs/{run_id}/attempts/1/jobs?per_page=30")
          jobs = result["jobs"]
          ids = [job.get("node_id") for job in jobs]
          require(result.get("total_count") == len(ids) and 0 < len(ids) <= 30
                  and all(ids) and len(ids) == len(set(ids)), "Incomplete exact-attempt job identities.")
          graph = read("Check run GraphQL lookup", "/graphql", {
              "query": """query($ids: [ID!]!) { nodes(ids: $ids) {
                ... on CheckRun {
                  id
                  checkSuite { workflowRun { id } }
                  deployment { id environment }
                }
              } }""",
              "variables": {"ids": ids},
          })
          require(not graph.get("errors"), "Check run GraphQL lookup returned errors.")
          nodes = (graph.get("data") or {}).get("nodes") or []
          require(len(nodes) == len(ids) and all(
              node and node.get("id") == job_id
              and ((node.get("checkSuite") or {}).get("workflowRun") or {}).get("id") == run["node_id"]
              for node, job_id in zip(nodes, ids)
          ), "Not all exact-attempt check runs link to the expected workflow run.")
          links = [(job, node["deployment"]) for job, node in zip(jobs, nodes) if node.get("deployment")]
          require(len(links) == 1, f"Expected exactly one linked deployment; observed {len(links)}.")
          job, deployment = links[0]
          require(job["name"].endswith("Compare Actions, check run, and deployment identities")
                  and job["status"] == "in_progress", "The link does not belong to the running probe job.")
          query = urlencode({"environment": environment, "per_page": 10})
          deployments = read("Deployment history", f"{base}/deployments?{query}")
          require(deployment.get("environment") == environment and deployment.get("id")
                  and deployments and deployments[0].get("node_id") == deployment["id"]
                  and deployments[0].get("environment") == environment,
                  "Linked deployment does not match the newest REST record in the protected environment.")
          print(f"Verified run {run_id}, attempt 1, job {job['id']}, deployment {deployments[0]['id']}.")
          PY
